<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ufoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" rx="16" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ufoGrad)" stroke-width="2" opacity="0.6" />

  <!-- UFO Glass Dome -->
  <path d="M 32 46 C 32 28, 68 28, 68 46 Z" fill="url(#domeGrad)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- UFO Main Metallic Disk Body -->
  <ellipse cx="50" cy="50" rx="36" ry="12" fill="url(#ufoGrad)" filter="url(#glow)" />
  <ellipse cx="50" cy="50" rx="36" ry="12" fill="none" stroke="#e0f2fe" stroke-width="1" opacity="0.8" />

  <!-- UFO Bottom Beam Rim -->
  <ellipse cx="50" cy="54" rx="20" ry="5" fill="#0284c7" />

  <!-- UFO Signal Lights -->
  <circle cx="24" cy="51" r="2.5" fill="#38bdf8" />
  <circle cx="37" cy="54" r="2.5" fill="#ffffff" />
  <circle cx="50" cy="55" r="3" fill="#a855f7" />
  <circle cx="63" cy="54" r="2.5" fill="#ffffff" />
  <circle cx="76" cy="51" r="2.5" fill="#38bdf8" />

  <!-- Tech Energy Beam -->
  <polygon points="40,58 60,58 68,82 32,82" fill="url(#ufoGrad)" opacity="0.25" />
</svg>
